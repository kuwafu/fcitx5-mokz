name: Multi-Distro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            pkg_manager: apt
            addon_dir: /usr/lib/x86_64-linux-gnu/fcitx5
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            pkg_manager: apt
            addon_dir: /usr/lib/x86_64-linux-gnu/fcitx5
          - distro: fedora
            image: fedora:latest
            pkg_manager: dnf
            addon_dir: /usr/lib64/fcitx5
          - distro: archlinux
            image: archlinux:latest
            pkg_manager: pacman
            addon_dir: /usr/lib/fcitx5

    env:
      RELEASE_VERSION: "1.0.1"
      RELEASE_URL: "https://github.com/kuwafu/fcitx5-mokz/releases/download/v1.0.1/fcitx5-mokz-v1.0.1-x86_64.tar.gz"
      RELEASE_SHA256: "b29fc0959126e2d9a16c435a9a8e5798058eaaf6086925ad3948cbd04d43dc3c"

    steps:
      - name: Install dependencies (${{ matrix.distro }})
        run: |
          set -euo pipefail
          case "${{ matrix.pkg_manager }}" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                pkg-config \
                libfcitx5core-dev \
                fcitx5 \
                curl \
                ca-certificates \
                tar \
                gzip \
                git \
                dpkg-dev
              ;;
            dnf)
              dnf install -y \
                gcc-c++ \
                cmake \
                make \
                pkgconf-pkg-config \
                fcitx5 \
                fcitx5-devel \
                tar \
                gzip \
                git \
                binutils
              if ! command -v curl >/dev/null 2>&1; then
                dnf install -y --allowerasing curl
              fi
              ;;
            pacman)
              pacman -Syu --noconfirm --needed \
                base-devel \
                cmake \
                pkgconf \
                fcitx5 \
                curl \
                ca-certificates \
                tar \
                gzip \
                git
              ;;
            *)
              echo "Unsupported package manager: ${{ matrix.pkg_manager }}" >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Source build verification
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          test -f build/libmokz.so

          echo "=== ldd (built libmokz.so) ==="
          ldd build/libmokz.so

          if ldd build/libmokz.so | grep -q "not found"; then
            echo "Error: unresolved shared library dependencies in built libmokz.so" >&2
            exit 1
          fi
          if ldd build/libmokz.so | grep -q "libmarisa"; then
            echo "Error: libmarisa should be statically linked" >&2
            exit 1
          fi

      - name: Release archive install.sh & ldd dependency check
        if: matrix.os != 'ubuntu-22.04'
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          ARCHIVE="${WORK_DIR}/fcitx5-mokz-v${RELEASE_VERSION}-x86_64.tar.gz"
          curl -fsSL -o "$ARCHIVE" "$RELEASE_URL"
          echo "${RELEASE_SHA256}  ${ARCHIVE}" | sha256sum -c -

          tar -xzf "$ARCHIVE" -C "$WORK_DIR"
          (
            cd "${WORK_DIR}/fcitx5-mokz-v${RELEASE_VERSION}-x86_64"
            ./install.sh
          )

          INSTALLED_SO="${{ matrix.addon_dir }}/libmokz.so"
          test -f "$INSTALLED_SO"
          test -f /usr/share/fcitx5/addon/mokz.conf
          test -f /usr/share/fcitx5/inputmethod/mokz.conf
          for f in dict.bin kenlm.binary reranker.bin connection.bin; do
            test -f "/usr/share/fcitx5/mokz/${f}"
          done

          echo "=== ldd (installed release libmokz.so) ==="
          ldd "$INSTALLED_SO"

          if ldd "$INSTALLED_SO" | grep -q "not found"; then
            echo "Error: unresolved shared library dependencies in installed release libmokz.so" >&2
            exit 1
          fi
          if ldd "$INSTALLED_SO" | grep -q "libmarisa"; then
            echo "Error: libmarisa should be statically linked in release libmokz.so" >&2
            exit 1
          fi

      - name: Verify .deb packaging script (Debian/Ubuntu)
        if: matrix.pkg_manager == 'apt'
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          ./packaging/deb/build-deb.sh --output "${WORK_DIR}/fcitx5-mokz_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb --info "${WORK_DIR}/fcitx5-mokz_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb --contents "${WORK_DIR}/fcitx5-mokz_${RELEASE_VERSION}_amd64.deb" | grep -F "./usr/lib/x86_64-linux-gnu/fcitx5/libmokz.so" >/dev/null
